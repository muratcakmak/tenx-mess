<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">tenx-mess logo: a 10x mark whose x is a broom sweeping package cubes</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB340"/>
      <stop offset="0.5" stop-color="#FF6A3D"/>
      <stop offset="1" stop-color="#FF2D6F"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7A0C2E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app-icon squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sheen)"/>

  <g filter="url(#lift)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1 -->
    <path d="M104 176 L140 150 V340" stroke-width="34"/>
    <!-- 0 -->
    <rect x="180" y="150" width="104" height="190" rx="52" stroke-width="34"/>
    <!-- x, first stroke -->
    <path d="M322 236 L424 350" stroke-width="30"/>
    <!-- x, second stroke: a broom -->
    <g transform="translate(360 312) rotate(40)">
      <path d="M0 -4 V-132" stroke-width="18"/>
      <rect x="-24" y="-6" width="48" height="18" rx="5" fill="#FFFFFF" stroke="none"/>
      <path d="M-22 14 H22 L38 70 H-38 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6"/>
      <path d="M-18 30 L-26 66 M-6 30 L-9 66 M6 30 L9 66 M18 30 L26 66" stroke="#FF6A3D" stroke-width="4" opacity="0.55"/>
    </g>
  </g>

  <!-- the mess: node_modules cubes being swept -->
  <g fill="#FFFFFF">
    <g transform="translate(236 404) rotate(-14)"><rect x="-15" y="-15" width="30" height="30" rx="6"/><path d="M-15 -4 H15 M-4 -15 V15" stroke="#FF6A3D" stroke-width="3" opacity="0.5"/></g>
    <g transform="translate(192 420) rotate(18)" opacity="0.9"><rect x="-11" y="-11" width="22" height="22" rx="5"/></g>
    <g transform="translate(270 432) rotate(32)" opacity="0.85"><rect x="-9" y="-9" width="18" height="18" rx="4"/></g>
    <g transform="translate(156 438) rotate(-28)" opacity="0.7"><rect x="-7" y="-7" width="14" height="14" rx="3"/></g>
    <circle cx="124" cy="444" r="5" opacity="0.55"/>
    <circle cx="300" cy="404" r="4" opacity="0.6"/>
  </g>
  <!-- sweep marks -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" opacity="0.6" stroke-width="5">
    <path d="M276 356 q -18 8 -24 26"/>
    <path d="M290 376 q -14 8 -18 22"/>
  </g>
</svg>
